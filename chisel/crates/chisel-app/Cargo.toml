[package]
name = "chisel-app"
description = "The editor itself: window, viewport, tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "chisel"
path = "src/main.rs"

[dependencies]
mesh-core = { path = "../mesh-core" }
glam = { workspace = true }
# x11/wayland are no-ops on Windows and macOS, but winit refuses to compile on
# Linux without one of them, so they stay in for anyone building here.
eframe = { version = "0.29", default-features = false, features = [
    "wgpu", "default_fonts", "x11", "wayland",
] }
egui = "0.29"
egui-wgpu = "0.29"
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }

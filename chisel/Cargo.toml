# Workspace, in the shape the Craft apps use: thin app crate, real work in
# libraries that can be tested without a window.
[workspace]
resolver = "3"
members = ["crates/mesh-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eidriaen/Claude-test"

[workspace.dependencies]
glam = "0.29"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 40px;
      font-family: sans-serif;
    }

    #player-wrap {
      width: min(640px, 95vw);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    #player-wrap iframe {
      width: 100%;
      height: 100%;
    }

    button {
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 28px 72px;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 6px 32px rgba(255, 0, 0, 0.4);
    }

    button:hover {
      background: #cc0000;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div id="player-wrap">
    <div id="player"></div>
  </div>

  <button onclick="playFromStart()">&#9654;&nbsp; PLAY</button>

  <script>
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    var player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'U_IOTMu5zDE',
        playerVars: { playsinline: 1, rel: 0 }
      });
    }

    function playFromStart() {
      if (!player || !player.seekTo) return;
      player.seekTo(0);
      player.playVideo();
    }
  </script>

</body>
</html>

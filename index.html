<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Terrain">
  <link rel="manifest" href="manifest.json">
  <title>Terrain</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #0d1b2a; }
    canvas { display: block; touch-action: none; }
    #hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.35);
      font: 13px/1 -apple-system, sans-serif;
      pointer-events: none;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div id="hint">drag to rotate &nbsp;·&nbsp; pinch to zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1b2a);
    scene.fog = new THREE.FogExp2(0x0d1b2a, 0.03);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 10, 16);

    // OrbitControls handles one-finger rotate and two-finger pinch natively on iOS
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 4;
    controls.maxDistance = 50;

    // Terrain
    const SIZE = 20;
    const SEG = 80;
    const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
    geo.rotateX(-Math.PI / 2);

    const pos = geo.attributes.position;
    const colorData = new Float32Array(pos.count * 3);

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);

      const h = Math.sin(x * 0.25) * Math.cos(z * 0.30) * 2.0
              + Math.sin(x * 0.60 + 1.2) * Math.sin(z * 0.40 + 0.5) * 0.8
              + Math.cos(x * 0.12 + z * 0.18) * 1.2
              + Math.sin(x * 1.10) * Math.cos(z * 0.90) * 0.3;

      pos.setY(i, h);

      // Dark valley green → bright peak green
      const t = Math.max(0, Math.min(1, (h + 2) / 5));
      colorData[i * 3 + 0] = 0.04 + t * 0.22;
      colorData[i * 3 + 1] = 0.22 + t * 0.42;
      colorData[i * 3 + 2] = 0.04 + t * 0.06;
    }

    geo.computeVertexNormals();
    geo.setAttribute('color', new THREE.BufferAttribute(colorData, 3));

    const terrain = new THREE.Mesh(
      geo,
      new THREE.MeshLambertMaterial({ vertexColors: true })
    );
    terrain.receiveShadow = true;
    scene.add(terrain);

    // Subtle wireframe overlay
    scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: 0x52b788,
      wireframe: true,
      transparent: true,
      opacity: 0.07,
    })));

    // Lighting
    scene.add(new THREE.AmbientLight(0x6a8fc8, 0.9));

    const sun = new THREE.DirectionalLight(0xffe8c0, 1.4);
    sun.position.set(12, 20, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 0.1, far: 60 });
    scene.add(sun);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Hide hint on first interaction
    renderer.domElement.addEventListener('pointerdown', () => {
      document.getElementById('hint').style.opacity = '0';
    }, { once: true });

    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>

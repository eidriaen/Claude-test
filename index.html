<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charmed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #08000f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      font-family: Georgia, serif;
      overflow: hidden;
      position: relative;
    }

    /* ── Starfield ─────────────────────────────────── */
    .stars, .stars2, .stars3 {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      pointer-events: none;
    }
    .stars  { background: transparent; animation: drift 120s linear infinite; }
    .stars2 { background: transparent; animation: drift 180s linear infinite reverse; opacity: .6; }
    .stars3 { background: transparent; animation: drift 90s linear infinite; opacity: .4; }

    .stars  span, .stars2 span, .stars3 span {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d, 3s) ease-in-out infinite;
      animation-delay: var(--dl, 0s);
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(-10%, -10%); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--lo, .2); transform: scale(1); }
      50%       { opacity: var(--hi, .9); transform: scale(1.3); }
    }

    /* ── Purple nebula glow ────────────────────────── */
    .nebula {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 20% 30%, rgba(80,0,120,.45) 0%, transparent 70%),
        radial-gradient(ellipse 60% 60% at 80% 70%, rgba(40,0,90,.5)  0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 50% 10%, rgba(100,20,160,.3) 0%, transparent 60%);
      animation: nebulaPulse 8s ease-in-out infinite;
    }
    @keyframes nebulaPulse {
      0%,100% { opacity: 1; }
      50%     { opacity: .7; }
    }

    /* ── Triquetra ─────────────────────────────────── */
    .triquetra {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(500px, 90vw);
      opacity: .045;
      pointer-events: none;
      animation: triquetaSpin 60s linear infinite;
    }
    @keyframes triquetaSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* ── Header ────────────────────────────────────── */
    h1 {
      font-size: clamp(2rem, 6vw, 3.8rem);
      font-weight: 400;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: #e8d5ff;
      text-shadow:
        0 0 20px rgba(160, 80, 255, .9),
        0 0 60px rgba(120, 40, 220, .6),
        0 0 100px rgba(80, 0, 160, .4);
      animation: glowPulse 4s ease-in-out infinite;
      position: relative;
      z-index: 1;
    }
    @keyframes glowPulse {
      0%,100% { text-shadow: 0 0 20px rgba(160,80,255,.9), 0 0 60px rgba(120,40,220,.6), 0 0 100px rgba(80,0,160,.4); }
      50%     { text-shadow: 0 0 30px rgba(200,120,255,1), 0 0 80px rgba(160,80,255,.8), 0 0 140px rgba(100,0,200,.6); }
    }

    /* ── Player ────────────────────────────────────── */
    #player-wrap {
      width: min(680px, 94vw);
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      box-shadow:
        0 0 0 1px rgba(160, 80, 255, .25),
        0 0 40px rgba(100, 0, 180, .5),
        0 0 80px rgba(60, 0, 120, .35);
    }
    #player-wrap iframe { width: 100%; height: 100%; }

    /* ── Button ────────────────────────────────────── */
    button {
      position: relative;
      z-index: 1;
      background: linear-gradient(135deg, #6a00b8, #3d0080);
      color: #f0e0ff;
      border: 1px solid rgba(180, 100, 255, .5);
      border-radius: 12px;
      padding: 28px 76px;
      font-size: 1.9rem;
      font-family: Georgia, serif;
      font-weight: 400;
      letter-spacing: .15em;
      cursor: pointer;
      transition: transform .1s, box-shadow .2s, background .2s;
      box-shadow:
        0 0 20px rgba(120, 0, 220, .6),
        0 6px 30px rgba(60, 0, 120, .5);
    }
    button::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 13px;
      background: linear-gradient(135deg, rgba(200,120,255,.4), transparent 60%);
      pointer-events: none;
    }
    button:hover {
      background: linear-gradient(135deg, #7d00d6, #4a009a);
      box-shadow: 0 0 35px rgba(150, 0, 255, .8), 0 8px 40px rgba(80, 0, 160, .6);
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <!-- Stars -->
  <div class="stars"  id="s1"></div>
  <div class="stars2" id="s2"></div>
  <div class="stars3" id="s3"></div>

  <!-- Purple nebula -->
  <div class="nebula"></div>

  <!-- Triquetra background symbol -->
  <svg class="triquetra" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path stroke="#a060ff" stroke-width="3" fill="rgba(120,40,220,0.15)"
      d="M100 20
         C115 20 140 35 145 60
         C158 45 175 48 180 65
         C185 82 170 100 155 105
         C165 120 160 140 145 148
         C130 156 112 148 105 135
         C100 145 95 145 95 135
         C88 148 70 156 55 148
         C40 140 35 120 45 105
         C30 100 15 82 20 65
         C25 48 42 45 55 60
         C60 35 85 20 100 20 Z"/>
    <!-- inner ring -->
    <circle cx="100" cy="100" r="18" stroke="#a060ff" stroke-width="2" fill="none"/>
    <!-- outer decorative ring -->
    <circle cx="100" cy="100" r="92" stroke="rgba(160,80,255,0.3)" stroke-width="1" fill="none" stroke-dasharray="6 4"/>
  </svg>

  <h1>Charmed</h1>

  <div id="player-wrap">
    <div id="player"></div>
  </div>

  <button onclick="playFromStart()">&#9654;&ensp;Play</button>

  <script>
    // ── Generate stars ──────────────────────────────
    function makeStars(id, count, minSize, maxSize) {
      const el = document.getElementById(id);
      for (let i = 0; i < count; i++) {
        const s = document.createElement('span');
        const size = minSize + Math.random() * (maxSize - minSize);
        s.style.cssText = [
          `width:${size}px`, `height:${size}px`,
          `top:${Math.random()*100}%`, `left:${Math.random()*100}%`,
          `--d:${2+Math.random()*5}s`,
          `--dl:${-Math.random()*5}s`,
          `--lo:${.1+Math.random()*.3}`,
          `--hi:${.6+Math.random()*.4}`,
        ].join(';');
        el.appendChild(s);
      }
    }
    makeStars('s1', 200, 1, 2.5);
    makeStars('s2', 100, 1, 1.8);
    makeStars('s3',  60, 2, 4);

    // ── YouTube IFrame API ──────────────────────────
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'U_IOTMu5zDE',
        playerVars: { playsinline: 1, rel: 0 }
      });
    }

    function playFromStart() {
      if (!player || !player.seekTo) return;
      player.seekTo(0);
      player.playVideo();
    }
  </script>

</body>
</html>

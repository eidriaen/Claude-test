<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charmed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0d0018;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      font-family: Georgia, serif;
      overflow: hidden;
      position: relative;
    }

    /* ── Wallpaper slideshow layers ─────────────────── */
    .bg {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 1.8s ease-in-out;
      opacity: 0;
    }
    .bg.visible { opacity: 1; }

    /* Dark overlay so content stays readable */
    .overlay {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(10,0,25,.55) 0%, rgba(5,0,15,.45) 100%);
      pointer-events: none;
    }

    /* ── Stars (fallback / layered on top of photos) ── */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .stars span {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d) ease-in-out infinite;
      animation-delay: var(--dl);
    }
    @keyframes twinkle {
      0%,100% { opacity: var(--lo); }
      50%      { opacity: var(--hi); transform: scale(1.4); }
    }

    /* ── Content ────────────────────────────────────── */
    h1 {
      position: relative;
      z-index: 1;
      font-size: clamp(2rem, 6vw, 3.8rem);
      font-weight: 400;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: #f0e0ff;
      text-shadow:
        0 0 18px rgba(180,100,255,.95),
        0 0 50px rgba(130,50,230,.7),
        0 0 90px rgba(80,0,180,.45);
      animation: glow 4s ease-in-out infinite;
    }
    @keyframes glow {
      0%,100% { text-shadow: 0 0 18px rgba(180,100,255,.95), 0 0 50px rgba(130,50,230,.7), 0 0 90px rgba(80,0,180,.45); }
      50%      { text-shadow: 0 0 28px rgba(220,150,255,1),  0 0 70px rgba(180,100,255,.9), 0 0 130px rgba(110,0,220,.65); }
    }

    #player-wrap {
      position: relative;
      z-index: 1;
      width: min(680px, 94vw);
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(180,100,255,.3),
        0 0 40px rgba(100,0,200,.55),
        0 0 90px rgba(60,0,140,.35);
    }
    #player-wrap iframe { width: 100%; height: 100%; }

    button {
      position: relative;
      z-index: 1;
      background: linear-gradient(135deg, #6500b8, #3a007a);
      color: #f0e0ff;
      border: 1px solid rgba(200,120,255,.5);
      border-radius: 12px;
      padding: 28px 76px;
      font-size: 1.9rem;
      font-family: Georgia, serif;
      letter-spacing: .12em;
      cursor: pointer;
      transition: transform .1s, box-shadow .2s, background .2s;
      box-shadow:
        0 0 22px rgba(130,0,240,.65),
        0 6px 30px rgba(60,0,130,.5);
    }
    button:hover {
      background: linear-gradient(135deg, #7800d6, #4800a0);
      box-shadow: 0 0 38px rgba(170,0,255,.85), 0 8px 40px rgba(90,0,170,.65);
    }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>

  <!-- Two bg layers for crossfade -->
  <div class="bg" id="bg-a"></div>
  <div class="bg" id="bg-b"></div>
  <div class="overlay"></div>
  <div class="stars" id="stars"></div>

  <h1>Charmed</h1>

  <div id="player-wrap">
    <div id="player"></div>
  </div>

  <button onclick="playFromStart()">&#9654;&ensp;Play</button>

  <script>
    // ── Stars ────────────────────────────────────────
    (function() {
      const el = document.getElementById('stars');
      for (let i = 0; i < 160; i++) {
        const s = document.createElement('span');
        const sz = .8 + Math.random() * 2;
        s.style.cssText = [
          `width:${sz}px`, `height:${sz}px`,
          `top:${Math.random()*100}%`, `left:${Math.random()*100}%`,
          `--d:${2+Math.random()*5}s`,
          `--dl:${-Math.random()*6}s`,
          `--lo:${.05+Math.random()*.25}`,
          `--hi:${.5+Math.random()*.5}`,
        ].join(';');
        el.appendChild(s);
      }
    })();

    // ── Wallpaper slideshow ──────────────────────────
    // AlphaCoders wallpaper IDs for Charmed (1998)
    const IDS = [479340, 922715, 430676];

    function tryLoad(id) {
      // AlphaCoders uses images1–images9.alphacoders.com CDN.
      // Try all servers in parallel and return the first URL that loads.
      const prefix = String(id).slice(0, 3);
      return new Promise(resolve => {
        let settled = false;
        let failed  = 0;
        for (let n = 1; n <= 9; n++) {
          const url = `https://images${n}.alphacoders.com/${prefix}/${id}.jpg`;
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => { if (!settled) { settled = true; resolve(url); } };
          img.onerror = () => { failed++; if (failed === 9 && !settled) resolve(null); };
          img.src = url;
        }
      });
    }

    (async function initSlideshow() {
      const loaded = (await Promise.all(IDS.map(tryLoad))).filter(Boolean);
      if (!loaded.length) return; // keep CSS fallback

      const layers = [document.getElementById('bg-a'), document.getElementById('bg-b')];
      let active = 0, idx = 0;

      function show(url) {
        const next = layers[active];
        next.style.backgroundImage = `url('${url}')`;
        // small delay so the image is painted before fade-in
        setTimeout(() => {
          layers[active].classList.add('visible');
          layers[1 - active].classList.remove('visible');
          active = 1 - active;
        }, 50);
      }

      show(loaded[0]);
      if (loaded.length > 1) {
        setInterval(() => {
          idx = (idx + 1) % loaded.length;
          show(loaded[idx]);
        }, 7000);
      }
    })();

    // ── YouTube IFrame API ───────────────────────────
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'U_IOTMu5zDE',
        playerVars: { playsinline: 1, rel: 0 }
      });
    }

    function playFromStart() {
      if (!player || !player.seekTo) return;
      player.seekTo(0);
      player.playVideo();
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cat Sitter">
  <link rel="manifest" href="manifest.json">
  <title>Cat Sitter</title>
  <style>
    :root {
      --bg:        #faf7f2;
      --card:      #ffffff;
      --accent:    #d4700a;
      --accent-lt: #fef3e7;
      --text:      #1e1810;
      --muted:     #7a6a58;
      --border:    #e8ddd0;
      --green:     #2e7d32;
      --warn-bg:   #fffbea;
      --warn-br:   #f5c400;
      --shadow:    0 2px 10px rgba(0,0,0,0.07);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: calc(68px + env(safe-area-inset-bottom));
    }

    /* ── Header ── */
    header {
      background: var(--accent);
      color: white;
      padding: 18px 20px 14px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    header p  { font-size: 13px; opacity: 0.85; margin-top: 3px; }

    /* ── Tab bar ── */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 50;
    }
    .tab {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 9px 0 6px;
      font-size: 10px; font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border: none; background: none;
      gap: 3px;
      transition: color 0.15s;
    }
    .tab.active { color: var(--accent); }
    .tab-icon { font-size: 22px; line-height: 1; }

    /* ── Panels ── */
    .panel { display: none; padding: 16px; }
    .panel.active { display: block; }

    /* ── Generic card ── */
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .section-title {
      font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.9px;
      color: var(--muted);
      margin: 20px 0 8px;
    }
    .section-title:first-child { margin-top: 4px; }

    /* ── Notice ── */
    .notice {
      background: var(--warn-bg);
      border: 1.5px solid var(--warn-br);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px; line-height: 1.5;
      margin-bottom: 12px;
    }

    /* ── Day cards ── */
    .day-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .day-name { font-size: 17px; font-weight: 700; }
    .today-badge {
      background: var(--accent); color: white;
      font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 100px;
    }

    .progress-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .prog-bar {
      flex: 1; height: 6px;
      background: var(--border); border-radius: 3px; overflow: hidden;
    }
    .prog-fill {
      height: 100%; background: var(--accent);
      border-radius: 3px; transition: width 0.3s ease;
    }
    .prog-fill.complete { background: var(--green); }
    .prog-label {
      font-size: 13px; color: var(--muted);
      min-width: 36px; text-align: right;
    }

    /* ── Task items ── */
    .task {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 11px 0;
      border-top: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .task:active { opacity: 0.6; }
    .check {
      width: 26px; height: 26px; flex-shrink: 0;
      border-radius: 8px;
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      margin-top: 1px;
    }
    .task.done .check {
      background: var(--green); border-color: var(--green);
    }
    .check-mark {
      display: none; color: white; font-size: 15px; font-weight: 700;
    }
    .task.done .check-mark { display: block; }
    .task-body { flex: 1; }
    .task-label { font-size: 16px; line-height: 1.3; }
    .task-sub   { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .task.done .task-label { text-decoration: line-through; color: var(--muted); }

    .all-done-msg {
      text-align: center;
      font-size: 14px; font-weight: 600; color: var(--green);
      padding: 8px 0 2px;
    }

    /* ── Cat cards ── */
    .cat-card {
      background: var(--card);
      border-radius: 16px; overflow: hidden;
      margin-bottom: 12px; box-shadow: var(--shadow);
    }
    .cat-photo {
      width: 100%; height: 320px;
      object-fit: cover; object-position: center top;
      display: block;
    }
    .cat-top {
      padding: 14px 16px 10px;
    }
    .cat-name { font-size: 22px; font-weight: 700; }
    .cat-meta { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.4; }

    .tags {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 0 16px 12px;
    }
    .tag {
      background: var(--accent-lt); color: var(--accent);
      font-size: 13px; font-weight: 600;
      padding: 4px 11px; border-radius: 100px;
    }

    .warn-box {
      margin: 0 16px 16px;
      background: var(--warn-bg);
      border: 1.5px solid var(--warn-br);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px; line-height: 1.4;
      display: flex; gap: 8px; align-items: flex-start;
    }
    .health-box {
      background: #e8f4fd; border-color: #90caf9;
    }

    /* ── Info panel ── */
    .info-row {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; }
    .info-icon { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; padding-top: 2px; }
    .info-lbl  { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
    .info-val  { font-size: 16px; font-weight: 600; }
    .code-val  { font-size: 30px; font-weight: 800; letter-spacing: 7px; color: var(--accent); }

    .door-photo {
      width: 100%; border-radius: 10px;
      display: block; margin-top: 10px;
      object-fit: cover; max-height: 220px;
    }
    .door-photo-caption {
      font-size: 12px; color: var(--muted);
      text-align: center; margin-top: 6px;
    }

    .call-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--accent); color: white;
      font-size: 17px; font-weight: 700;
      padding: 15px; border-radius: 14px;
      text-decoration: none; margin-top: 8px;
    }
    .call-btn:active { opacity: 0.8; }

    .lock-prompt {
      text-align: center; padding: 8px 0 4px;
    }
    .lock-input-row {
      display: flex; gap: 8px; margin-top: 12px;
    }
    .lock-input-row input {
      flex: 1; padding: 11px 14px; border-radius: 10px;
      border: 1.5px solid var(--border); font-size: 16px;
      background: var(--bg); color: var(--text);
      outline: none;
    }
    .lock-input-row input:focus { border-color: var(--accent); }
    .lock-input-row button {
      padding: 11px 18px; border-radius: 10px;
      background: var(--accent); color: white;
      border: none; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .lock-input-row button:active { opacity: 0.8; }
    .lock-msg { font-size: 13px; margin-top: 10px; min-height: 18px; }

    .cal-btns {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .cal-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 6px; border-radius: 10px;
      font-size: 13px; font-weight: 600;
      text-decoration: none; border: none; cursor: pointer;
    }
    .cal-btn:active { opacity: 0.7; }
    .cal-btn-google { background: #e8f0fe; color: #1a73e8; }
    .cal-btn-apple  { background: #f0f0f0; color: #1c1c1e; }
  </style>
</head>
<body>

<header>
  <h1>🐱 Cat Sitter Guide</h1>

<div id="panel-tasks"  class="panel active"></div>
<div id="panel-cats"   class="panel"></div>
<div id="panel-info"   class="panel"></div>
<div id="panel-coffee" class="panel"></div>

<nav>
  <button class="tab active" onclick="switchTab('tasks',this)">
    <span class="tab-icon">📋</span>Tasks
  </button>
  <button class="tab" onclick="switchTab('cats',this)">
    <span class="tab-icon">🐱</span>Cats
  </button>

</nav>

<script>

const CATS = [
  {

    health: ['Asthma'],
  },
];

// ── Storage ────────────────────────────────────────────────────────────────
const DB   = 'https://catsitter-b7668-default-rtdb.europe-west1.firebasedatabase.app';
const _fc  = {};
const key  = (d, id) => `cs_${d}_${id}`;
const get  = (d, id) => !!_fc[key(d, id)];
function set(d, id, v) {
  _fc[key(d, id)] = v;
  fetch(`${DB}/tasks/${key(d, id)}.json`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(v)
  }).catch(() => {});
}

// ── Today ──────────────────────────────────────────────────────────────────
const today = new Date().toISOString().slice(0, 10);

const statusEl = document.getElementById('trip-status');
if      (today < '2026-06-11') statusEl.textContent = 'Owners leave Jun 10 · Return Jun 14';
else if (today > '2026-06-13') statusEl.textContent = 'Owners return Jun 14 — thank you! 🙏';
else                           statusEl.textContent  = 'Jun 10–14 · Thank you for taking care of them! 🙏';

// ── Calendar ───────────────────────────────────────────────────────────────
function dateStamp(date) { return date.replace(/-/g, ''); }
function nextDay(date) {
  const d = new Date(date); d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10).replace(/-/g, '');
}
function gcalUrl(date) {
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=Cat+Sitter+Visit&dates=${dateStamp(date)}/${nextDay(date)}&details=Look+after+Ruski%2C+Evi+%26+Kiara`;
}
function addToAppleCal(date) {
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Cat Sitter//EN',
    'BEGIN:VEVENT',
    `DTSTART;VALUE=DATE:${dateStamp(date)}`,
    `DTEND;VALUE=DATE:${nextDay(date)}`,
    'SUMMARY:Cat Sitter Visit',
    'DESCRIPTION:Look after Ruski\\, Evi & Kiara',
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([ics], {type: 'text/calendar'})),
    download: `cat-sitter-${date}.ics`
  });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function addRangeToAppleCal() {
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Cat Sitter//EN',
    'BEGIN:VEVENT',
    'DTSTART;VALUE=DATE:20260611',
    'DTEND;VALUE=DATE:20260614',
    'SUMMARY:Cat Sitter Visit',
    'DESCRIPTION:Look after Ruski\\, Evi & Kiara',
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([ics], {type: 'text/calendar'})),
    download: 'cat-sitter-jun11-13.ics'
  });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ── Tasks ──────────────────────────────────────────────────────────────────
function renderTasks() {
  const p = document.getElementById('panel-tasks');

  p.insertAdjacentHTML('beforeend', `
    <div class="card" style="text-align:center">
      <div style="font-size:13px;color:var(--muted);margin-bottom:10px">Add all visit days to your calendar</div>
      <div class="cal-btns">
        <a class="cal-btn cal-btn-google" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Cat+Sitter+Visit&dates=20260611/20260614&details=Look+after+Ruski%2C+Evi+%26+Kiara" target="_blank" rel="noopener">📅 Google Calendar</a>
        <button class="cal-btn cal-btn-apple" onclick="addRangeToAppleCal()">🍎 Apple Calendar</button>
      </div>
    </div>`);

  if (today === '2026-06-10') {
    p.insertAdjacentHTML('beforeend',
      `<div class="notice">⚠️ <strong>Departure day:</strong> The owners will leave extra food and fresh water before they go. Your first visit is tomorrow, Thursday June 11.</div>`);
  }

  VISIT_DAYS.forEach(({ date, label }) => {
    const isToday = date === today;
    const card = document.createElement('div');
    card.id = `day-${date}`;
    card.className = 'card';
    card.innerHTML = `
      <div class="day-header">
        <span class="day-name">${label}</span>
        ${isToday ? '<span class="today-badge">TODAY</span>' : ''}
      </div>
      <div class="progress-row">
        <div class="prog-bar"><div class="prog-fill" id="fill-${date}"></div></div>
        <span class="prog-label" id="plbl-${date}"></span>
      </div>
      ${TASKS.map(t => `
        <div class="task${get(date,t.id)?' done':''}" id="t-${date}-${t.id}" onclick="toggle('${date}','${t.id}')">
          <div class="check"><span class="check-mark">✓</span></div>
          <div class="task-body">
            <div class="task-label">${t.icon} ${t.label}</div>
            ${t.sub ? `<div class="task-sub">${t.sub}</div>` : ''}
          </div>
        </div>`).join('')}
    `;
    p.appendChild(card);
    refreshProgress(date);
  });
}

function toggle(date, id) {
  set(date, id, !get(date, id));
  document.getElementById(`t-${date}-${id}`).classList.toggle('done', get(date, id));
  refreshProgress(date);
}

function refreshProgress(date) {
  const done = TASKS.filter(t => get(date, t.id)).length;
  const total = TASKS.length;
  const pct = Math.round(done / total * 100);
  const complete = done === total;

  const fill = document.getElementById(`fill-${date}`);
  fill.style.width = pct + '%';
  fill.classList.toggle('complete', complete);
  document.getElementById(`plbl-${date}`).textContent = `${done}/${total}`;

  const card = document.getElementById(`day-${date}`);
  const existing = card.querySelector('.all-done-msg');
  if (complete && !existing) {
    card.insertAdjacentHTML('beforeend', `<div class="all-done-msg">✅ All done — great job!</div>`);
  } else if (!complete && existing) {
    existing.remove();
  }
}

// ── Cats ───────────────────────────────────────────────────────────────────
function renderCats() {
  const p = document.getElementById('panel-cats');
  p.insertAdjacentHTML('beforeend',
    `<div class="notice">⚠️ <strong>Door warning:</strong> All three cats love the outdoors. Always check behind you before opening the front door or the terrace door.</div>`);

  CATS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'cat-card';
    el.innerHTML = `
      <img src="${c.photo}" alt="${c.name}" class="cat-photo"${c.photoPos ? ` style="object-position:${c.photoPos}"` : ''}>
      <div class="cat-top">
        <div class="cat-name">${c.name}</div>
        <div class="cat-meta">${c.meta}</div>
      </div>
      <div class="tags">${c.traits.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      ${c.health ? c.health.map(h => `<div class="warn-box health-box">🩺 <span>${h}</span></div>`).join('') : ''}
      ${c.warnings.map(w => `<div class="warn-box">⚠️ <span>${w}</span></div>`).join('')}
    `;
    p.appendChild(el);
  });
}

// ── Door code unlock ───────────────────────────────────────────────────────
const _S = 'c83e0f8bc0d2b25f3b2a9e602a69550a';
const _A = ['0162a975a6d9d6cbe4402230673f0d03ee925ca8cb8a4241caa21b25e1f521f3'];
const _E = '06158e28e214';
async function _h(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}

async function tryUnlock() {
  const msg = document.getElementById('lock-msg');
  const num = document.getElementById('phone-input').value.replace(/\D/g,'');
  if (!num) return;
  const hash = await _h(num + _S);
  if (_A.includes(hash)) {
    const saltBuf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(_S));
    const saltBytes = new Uint8Array(saltBuf);
    const code = _E.match(/.{2}/g).map((h,i) => String.fromCharCode(parseInt(h,16) ^ saltBytes[i])).join('');
    document.getElementById('code-display').textContent = code;
    document.getElementById('code-locked').style.display  = 'none';
    document.getElementById('code-revealed').style.display = 'block';
  } else {
    msg.style.color = '#e65100';
    msg.textContent = 'Phone number not recognised.';
  }
}

function renderInfo() {

      </div>
      <img src="terrace-door.jpg" alt="Terrace door keypad" class="door-photo">

    <div class="section-title">Contact</div>
    <div class="card">
      <div class="info-row">

      </div>
      <a class="call-btn" href="tel:+4793266996">📞 &nbsp;+47 93 26 69 96</a>
      <a class="call-btn" href="tel:+4798033356" style="margin-top:8px">📞 &nbsp;+47 98 03 33 56</a>
    </div>

    <div class="section-title">Emergency</div>
    <div class="card">
      <div class="info-row">
        <span class="info-icon">🏥</span>
        <div>
          <div class="info-lbl">Nearest animal hospital</div>
          <div class="info-val">AniCura Dyresykehus Oslo</div>
        </div>
      </div>
      <div style="padding: 0 16px 12px; display:flex; flex-direction:column; gap:10px;">
        <a href="https://maps.app.goo.gl/aCrAUZywuhHzbcM68?g_st=ic" target="_blank" rel="noopener"
           style="display:flex; align-items:center; gap:8px; background:#f0f7f0; border:1.5px solid #81c784; border-radius:10px; padding:12px; text-decoration:none; color:inherit; font-size:15px; font-weight:600;">
          🗺️ Open in Maps

// ── Tabs ───────────────────────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`panel-${name}`).classList.add('active');
  btn.classList.add('active');
  window.scrollTo(0, 0);
}

function pollDB() {
  fetch(`${DB}/tasks.json`).then(r => r.json()).then(data => {
    if (!data || typeof data !== 'object') return;
    Object.entries(data).forEach(([k, v]) => {
      if (!!_fc[k] !== !!v) {
        _fc[k] = v;
        const m = k.match(/^cs_(\d{4}-\d{2}-\d{2})_(.+)$/);
        if (m) {
          document.getElementById(`t-${m[1]}-${m[2]}`)?.classList.toggle('done', !!v);
          refreshProgress(m[1]);
        }
      }
    });
  }).catch(() => {});
}

fetch(`${DB}/tasks.json`)
  .then(r => r.json())
  .then(data => { if (data && typeof data === 'object') Object.assign(_fc, data); })
  .catch(() => {})
  .finally(() => {
    renderTasks();
    renderCats();
    renderInfo();
    renderCoffee();
    setInterval(pollDB, 10000);
  });
</script>
